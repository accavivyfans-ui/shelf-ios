name: Shelf
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: '16.0'
targets:
  Shelf:
    type: application
    platform: iOS
    sources: [Shelf]
    info:
      path: Shelf/Info.plist
      properties:
        CFBundleDisplayName: 서재
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.shelf
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 서재
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.1.1'
        CURRENT_PROJECT_VERSION: '3'
        CODE_SIGNING_ALLOWED: NO
  ShelfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Shelf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Shelf
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.shelf.uitests
        SWIFT_VERSION: '5.0'
schemes:
  Shelf:
    build:
      targets:
        Shelf: all
    test:
      targets:
        - ShelfUITests
